name: Required Gates

on:
  pull_request:
    branches: [main, dev, staging]
  push:
    branches: [main, dev, staging]

permissions:
  contents: read

jobs:
  build:
    name: ci/build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ]; then
            gradle --no-daemon clean assemble -x test
          else
            echo "No Gradle root build in this repository; skipping Gradle build."
          fi
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json build in this repository; skipping Node build."
          fi

  test:
    name: ci/test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the AsyncAPI breaking-change check can diff against the base branch.
          fetch-depth: 0

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f settings.gradle ]; then
            gradle --no-daemon test
          else
            echo "No Gradle root test task in this repository; skipping Gradle test."
          fi
          if [ -f package.json ]; then
            npm ci
            npm test --if-present
          else
            echo "No package.json test in this repository; skipping Node test."
          fi

      - name: OpenAPI contract lint
        if: ${{ hashFiles('openapi/*.yaml') != '' || hashFiles('api/openapi/*.yaml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          if ls openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint openapi/*.yaml
          elif ls api/openapi/*.yaml >/dev/null 2>&1; then
            npx -y @redocly/cli@1.27.1 lint api/openapi/*.yaml
          fi

      - name: AsyncAPI contract lint
        if: ${{ hashFiles('asyncapi/*.yaml') != '' || hashFiles('asyncapi/*.yml') != '' }}
        env:
          NPM_CONFIG_CACHE: /tmp/.npm
        shell: bash
        run: |
          set -euo pipefail
          # asyncapi validate accepts a single spec file, so validate one file per call.
          shopt -s nullglob
          specs=(asyncapi/*.yaml asyncapi/*.yml)
          for spec in "${specs[@]}"; do
            echo "Validating ${spec}"
            npx -y @asyncapi/cli@2.13.0 validate "${spec}"
          done

      - name: AsyncAPI breaking-change check
        if: ${{ hashFiles('asyncapi/*.yaml') != '' || hashFiles('asyncapi/*.yml') != '' }}
        env:
          # Always main, also for stacked PRs: versions count from the first merge to main, and a spec
          # that is only on a stacked base branch is pre-release (asyncapi/README.md, Change rules).
          BASE_REF: origin/main
        shell: bash
        run: |
          set -euo pipefail
          # Compares each asyncapi/*.yaml with the merge base of BASE_REF; new files are skipped.
          # Rules and the accepted-breaking exception file: asyncapi/README.md.
          bash scripts/ci/asyncapi-breaking.sh

      - name: Guardrail - disallow generic map request payloads
        shell: bash
        run: |
          if [ -d src/main/java ]; then
            if grep -R -nE "Map<\s*String\s*,\s*Object\s*>" src/main/java --include="*Controller.java"; then
              echo "Generic Map<String,Object> payloads are disallowed in controllers."
              exit 1
            fi
          else
            echo "No Java controller sources in this repository; guardrail check skipped."
          fi

  security:
    name: ci/security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          # Pick the asset by runner architecture and check it against the release's sha256 before extracting.
          case "$(uname -m)" in
            x86_64) gitleaks_arch=x64; gitleaks_sha=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c ;;
            aarch64|arm64) gitleaks_arch=arm64; gitleaks_sha=5f2edbe1f49f7b920f9e06e90759947d3c5dfc16f752fb93aaafc17e9d14cf07 ;;
            *) echo "unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o "$tmpdir/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_${gitleaks_arch}.tar.gz"
          echo "${gitleaks_sha}  $tmpdir/gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C "$tmpdir" -f "$tmpdir/gitleaks.tar.gz"
          sudo install "$tmpdir/gitleaks" /usr/local/bin/gitleaks
          rm -rf "$tmpdir"

      - name: Run gitleaks (workspace scan)
        shell: bash
        run: |
          gitleaks detect --source . --no-banner --redact --no-git --config .gitleaks.toml \
            --report-format json --report-path gitleaks-report.json || {
              cat gitleaks-report.json
              exit 1
            }
