# AsyncAPI contract for svc-pay-request-to-pay.
# Status: Proposed. The provider repository owns this contract; this catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate asyncapi/svc-pay-request-to-pay.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-pay-request-to-pay
info:
  title: svc-pay-request-to-pay events
  version: 1.0.0
  description: |-
    Event contract for svc-pay-request-to-pay (repository fintechbankx-lendingpayments-payment-orchestration-request-to-pay, canonical name fintechbankx-payments-request-to-pay-service).

    Status: Proposed. Owner: Recurring and Bulk Payments Squad, Lending and Money Movement Tribe. Event namespace: `evt.pay.rtp`.

    Implementation status: Published today by KafkaPayRequestNotificationAdapter to the legacy topic rtp.pay_requests.v1 as bare event records (no envelope, no outbox). This contract is the target; the producer must dual-publish during migration.

    Every message uses the standard envelope (common/event-envelope.yaml). All events go to one topic per aggregate, `evt.pay.rtp.v1`, with the record key = aggregateId and the eventType, eventId and correlationId record headers (ADR-019). The topic uses cleanup.policy=delete. Adding an optional field or a new event type is a minor change; a removal, rename or type change in one event is a new event major (eventType ...v2) published on the same topic alongside the old one until consumers move.

    Mapping notes: Source record fields eventId, aggregateId and occurredOn move to the envelope (eventId, aggregateId, occurredAt). The record field version is a schema version (always 1) and is carried by the eventType suffix, not by aggregateVersion.
  tags:
  - name: payments
  - name: evt.pay.rtp
  x-service-id: svc-pay-request-to-pay
  x-event-namespace: evt.pay.rtp
  x-owning-squad: Recurring and Bulk Payments Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit, SASL_SSL
      with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with Strimzi-issued
      client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  rtp:
    address: evt.pay.rtp.v1
    title: evt.pay.rtp.v1
    description: 'Every event of the rtp aggregate, keyed by aggregateId so that the events of one aggregate instance stay
      in order in one partition (ADR-019, one topic per aggregate). The eventType record header names the event:
      Payments.PayRequest.Created.v1, Payments.PayRequest.Accepted.v1, Payments.PayRequest.Rejected.v1. Consumers skip
      event types they do not handle.'
    messages:
      PayRequestCreated:
        $ref: '#/components/messages/PayRequestCreated'
      PayRequestAccepted:
        $ref: '#/components/messages/PayRequestAccepted'
      PayRequestRejected:
        $ref: '#/components/messages/PayRequestRejected'
    bindings:
      kafka:
        topic: evt.pay.rtp.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
operations:
  publishPayRequestCreated:
    action: send
    title: Publish Payments.PayRequest.Created.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Created.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/rtp'
    messages:
    - $ref: '#/channels/rtp/messages/PayRequestCreated'
  publishPayRequestAccepted:
    action: send
    title: Publish Payments.PayRequest.Accepted.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Accepted.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/rtp'
    messages:
    - $ref: '#/channels/rtp/messages/PayRequestAccepted'
  publishPayRequestRejected:
    action: send
    title: Publish Payments.PayRequest.Rejected.v1
    summary: svc-pay-request-to-pay publishes Payments.PayRequest.Rejected.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/rtp'
    messages:
    - $ref: '#/channels/rtp/messages/PayRequestRejected'
components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    DeadLetterHeaders:
      $ref: ./common/event-envelope.yaml#/DeadLetterHeaders
    MonetaryAmount:
      $ref: ./common/event-envelope.yaml#/MonetaryAmount
    DecimalAmount:
      $ref: ./common/event-envelope.yaml#/DecimalAmount
    PayRequestCreatedData:
      type: object
      description: Payload of Payments.PayRequest.Created.v1.
      properties:
        creditorName:
          type: string
          description: Creditor display name as entered in the request.
        amount:
          allOf:
          - $ref: '#/components/schemas/DecimalAmount'
          description: Requested amount.
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: ^[A-Z]{3}$
        debtorId:
          type: string
          description: Pseudonymous PSU id of the debtor.
          minLength: 1
      required:
      - creditorName
      - amount
      - currency
      - debtorId
    PayRequestAcceptedData:
      type: object
      description: Payload of Payments.PayRequest.Accepted.v1.
      properties:
        paymentId:
          type:
          - string
          - 'null'
          description: Id of the resulting payment, if any.
        amount:
          allOf:
          - $ref: '#/components/schemas/DecimalAmount'
          description: Accepted amount.
        currency:
          type: string
          description: ISO 4217 currency code.
          pattern: ^[A-Z]{3}$
        creditorName:
          type: string
          description: Creditor display name.
        debtorId:
          type: string
          description: Pseudonymous PSU id of the debtor.
          minLength: 1
      required:
      - amount
      - currency
      - creditorName
      - debtorId
    PayRequestRejectedData:
      type: object
      description: Payload of Payments.PayRequest.Rejected.v1.
      properties: {}
  messages:
    PayRequestCreated:
      name: PayRequestCreated
      title: Payments.PayRequest.Created.v1
      summary: A request to pay was created for the debtor.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Created.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Created.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestCreatedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (consentId of the pay request).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestCreatedEvent
    PayRequestAccepted:
      name: PayRequestAccepted
      title: Payments.PayRequest.Accepted.v1
      summary: The debtor accepted the request and a payment was created (request status CONSUMED).
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Accepted.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Accepted.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestAcceptedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (consentId of the pay request).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestAcceptedEvent
    PayRequestRejected:
      name: PayRequestRejected
      title: Payments.PayRequest.Rejected.v1
      summary: The debtor rejected the request.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Rejected.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.PayRequest.Rejected.v1
            producer:
              const: svc-pay-request-to-pay
            data:
              $ref: '#/components/schemas/PayRequestRejectedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (consentId of the pay request).
          bindingVersion: 0.5.0
      x-source-class: com.enterprise.openfinance.requesttopay.domain.event.PayRequestRejectedEvent
    DeadLetter:
      name: DeadLetter
      title: Dead letter for evt.pay.rtp
      summary: A message from this namespace that a consumer could not process after bounded retries.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/DeadLetterHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        kafka:
          key:
            type: string
            description: Original record key (aggregateId).
          bindingVersion: 0.5.0
  securitySchemes:
    mskIam:
      type: userPassword
      description: SASL_SSL with SASL mechanism AWS_MSK_IAM. There is no user or password; the client signs with the AWS
        credentials of its IRSA role, and a topic-scoped IAM policy (terraform module msk-client-access) grants produce
        or consume rights. AsyncAPI has no IAM scheme type, so userPassword stands for the SASL family.
      x-sasl-mechanism: AWS_MSK_IAM
    mtls:
      type: X509
      description: Mutual TLS with Strimzi-issued client certificates (local and non-AWS clusters only).
