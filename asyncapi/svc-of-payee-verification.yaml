# AsyncAPI contract for svc-of-payee-verification.
# Status: Proposed. The provider repository owns this contract; this catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate asyncapi/svc-of-payee-verification.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-of-payee-verification
info:
  title: svc-of-payee-verification events
  version: 1.0.0
  description: 'Event contract for svc-of-payee-verification (repository fintechbankx-openfinance-payee-metadata-payee-verification,
    canonical name fintechbankx-openfinance-payee-verification-service).


    Status: Proposed. Owner: Payee and Metadata Squad, Open Finance Tribe. Event namespace: `evt.of.payee`.


    Implementation status: contract only on the provider default branch; the transactional outbox and relay are on the provider
    branch claude/openfinance-deployable-ra36dq. No consumer is declared yet; payment initiation is the intended one.


    Every message uses the standard envelope (common/event-envelope.yaml). Record key is the aggregateId. Adding an optional
    field is a minor change; any removal, rename or type change is a new major version on a new topic with dual-publish.'
  tags:
  - name: payee
  - name: evt.of.payee
  x-service-id: svc-of-payee-verification
  x-event-namespace: evt.of.payee
  x-owning-squad: Payee and Metadata Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit, SASL_SSL
      with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with Strimzi-issued
      client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  verificationCompleted:
    address: evt.of.payee.verification-completed.v1
    title: evt.of.payee.verification-completed.v1
    description: OpenFinance.PayeeVerification.VerificationCompleted.v1. A confirmation-of-payee check completed and its decision
      was recorded.
    messages:
      PayeeVerificationCompleted:
        $ref: '#/components/messages/PayeeVerificationCompleted'
    bindings:
      kafka:
        topic: evt.of.payee.verification-completed.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  deadLetter:
    address: evt.of.payee.dlq.v1
    title: evt.of.payee.dlq.v1
    description: 'Dead-letter topic owned by svc-of-payee-verification (ADR-019/ADR-024): written by this service''s own consumers
      after bounded retries. Consumers of this namespace write to their own namespace DLQ, not here.'
    messages:
      DeadLetter:
        $ref: '#/components/messages/DeadLetter'
    bindings:
      kafka:
        topic: evt.of.payee.dlq.v1
        partitions: 6
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 1209600000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
operations:
  publishPayeeVerificationCompleted:
    action: send
    title: Publish OpenFinance.PayeeVerification.VerificationCompleted.v1
    summary: svc-of-payee-verification publishes OpenFinance.PayeeVerification.VerificationCompleted.v1 through its transactional
      outbox.
    channel:
      $ref: '#/channels/verificationCompleted'
    messages:
    - $ref: '#/channels/verificationCompleted/messages/PayeeVerificationCompleted'
components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    DeadLetterHeaders:
      $ref: ./common/event-envelope.yaml#/DeadLetterHeaders
    PayeeVerificationCompletedData:
      type: object
      description: Outcome of one confirmation-of-payee check. No payer-entered name, holder name or raw account number.
      additionalProperties: true
      properties:
        verificationId:
          type: string
          minLength: 1
          description: Verification id (same as aggregateId).
        tppId:
          type: string
          minLength: 1
          description: TPP client id that requested the check.
        accountReferenceHash:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 (hex) of scheme:identification of the checked account.
        outcome:
          type: string
          enum:
          - MATCH
          - CLOSE_MATCH
          - NO_MATCH
          - UNAVAILABLE
          description: Match result returned to the TPP.
        reasonCode:
          type:
          - string
          - 'null'
          description: Machine reason code for the outcome.
        occurredAt:
          type: string
          format: date-time
      required:
      - verificationId
      - tppId
      - accountReferenceHash
      - outcome
      - occurredAt
  messages:
    PayeeVerificationCompleted:
      name: PayeeVerificationCompleted
      title: OpenFinance.PayeeVerification.VerificationCompleted.v1
      summary: A confirmation-of-payee check completed and its decision was recorded.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/EventHeaders'
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: OpenFinance.PayeeVerification.VerificationCompleted.v1
            producer:
              const: svc-of-payee-verification
            data:
              $ref: '#/components/schemas/PayeeVerificationCompletedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (verificationId).
          bindingVersion: 0.5.0
    DeadLetter:
      name: DeadLetter
      title: Dead letter for evt.of.payee
      summary: A message from this namespace that a consumer could not process after bounded retries.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/DeadLetterHeaders'
      payload:
        $ref: '#/components/schemas/EventEnvelope'
      bindings:
        kafka:
          key:
            type: string
            description: Original record key (aggregateId).
          bindingVersion: 0.5.0
  securitySchemes:
    mskIam:
      type: userPassword
      description: SASL_SSL with SASL mechanism AWS_MSK_IAM. There is no user or password; the client signs with the AWS credentials
        of its IRSA role, and a topic-scoped IAM policy (terraform module msk-client-access) grants produce or consume rights.
        AsyncAPI has no IAM scheme type, so userPassword stands for the SASL family.
      x-sasl-mechanism: AWS_MSK_IAM
    mtls:
      type: X509
      description: Mutual TLS with Strimzi-issued client certificates (local and non-AWS clusters only).
