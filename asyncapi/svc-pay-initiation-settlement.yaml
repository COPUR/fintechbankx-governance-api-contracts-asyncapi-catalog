components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    DeadLetterHeaders:
      $ref: ./common/event-envelope.yaml#/DeadLetterHeaders
    MonetaryAmount:
      $ref: ./common/event-envelope.yaml#/MonetaryAmount
    DecimalAmount:
      $ref: ./common/event-envelope.yaml#/DecimalAmount
    PaymentCreatedData:
      type: object
      description: Payload of Payments.Payment.Created.v1.
      properties:
        paymentId:
          type: string
          description: Payment id (same as aggregateId).
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        amount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Payment amount.
        paymentType:
          type: string
          description: Payment type.
          enum:
          - TRANSFER
          - WIRE_TRANSFER
          - ACH
          - CHECK
          - CREDIT_CARD
          - DEBIT_CARD
          - MOBILE_PAYMENT
          - LOAN_PAYMENT
          - BILL_PAYMENT
      required:
      - paymentId
      - customerId
      - amount
      - paymentType
    PaymentProcessingStartedData:
      type: object
      description: Payload of Payments.Payment.ProcessingStarted.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
      required:
      - paymentId
      - customerId
    PaymentCompletedData:
      type: object
      description: Payload of Payments.Payment.Completed.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        amount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Completed amount.
      required:
      - paymentId
      - customerId
      - amount
    PaymentFailedData:
      type: object
      description: Payload of Payments.Payment.Failed.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        failureReason:
          type: string
          description: Failure reason code or text. Must not contain personal data.
      required:
      - paymentId
      - customerId
      - failureReason
    PaymentCancelledData:
      type: object
      description: Payload of Payments.Payment.Cancelled.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        cancellationReason:
          type: string
          description: Cancellation reason. Must not contain personal data.
      required:
      - paymentId
      - customerId
      - cancellationReason
    PaymentRefundedData:
      type: object
      description: Payload of Payments.Payment.Refunded.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        refundAmount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Refunded amount.
      required:
      - paymentId
      - customerId
      - refundAmount
    PaymentLoanPaymentCreatedData:
      type: object
      description: Payload of Payments.Payment.LoanPaymentCreated.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        loanId:
          type: string
          description: Loan id.
          minLength: 1
