# AsyncAPI contract for svc-pay-initiation-settlement.
# Status: Proposed. The provider repository owns this contract; this catalog mirrors it.
# Naming: docs/NAMING_CONVENTION_DDD_EDA_BUSINESS_CONTEXT.md
# Validate: npx -y @asyncapi/cli@2.13.0 validate asyncapi/svc-pay-initiation-settlement.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-pay-initiation-settlement
info:
  title: svc-pay-initiation-settlement events
  version: 1.0.0
  description: |-
    Event contract for svc-pay-initiation-settlement (repository fintechbankx-lendingpayments-payment-orchestration-initiation-settlement, canonical name fintechbankx-payments-initiation-settlement-service).

    Status: Proposed. Owner: Payment Orchestration Squad, Lending and Money Movement Tribe. Event namespace: `evt.pay.payment`.

    Implementation status: Contract only. Events are raised on the Payment aggregate (payment-domain Payment.java) but the repository has no publisher adapter or outbox yet.

    Every message uses the standard envelope (common/event-envelope.yaml). Record key is the aggregateId. Topics use cleanup.policy=delete. Adding an optional field is a minor change; any removal, rename or type change is a new major version on a new topic with dual-publish.
  tags:
  - name: payments
  - name: evt.pay.payment
  x-service-id: svc-pay-initiation-settlement
  x-event-namespace: evt.pay.payment
  x-owning-squad: Payment Orchestration Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit,
      SASL_SSL with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with
      Strimzi-issued client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  created:
    address: evt.pay.payment.created.v1
    title: evt.pay.payment.created.v1
    description: Payments.Payment.Created.v1. A payment was created.
    messages:
      PaymentCreated:
        $ref: '#/components/messages/PaymentCreated'
    bindings:
      kafka:
        topic: evt.pay.payment.created.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
  processingStarted:
    address: evt.pay.payment.processing-started.v1
    title: evt.pay.payment.processing-started.v1
