# AsyncAPI contract for svc-pay-initiation-settlement (provider copy; source of truth).
# Status: Proposed. Must match payment-infrastructure PaymentEventEnvelopeFactory (PaymentEventContractTest).
# Channels, operations and messages match the catalog's converted copy at 44837cc (one topic per aggregate).
# Validate: npx -y @asyncapi/cli@2.13.0 validate api/asyncapi/svc-pay-initiation-settlement.yaml
asyncapi: 3.0.0
id: urn:fintechbankx:asyncapi:svc-pay-initiation-settlement
info:
  title: svc-pay-initiation-settlement events
  version: 1.0.0
  description: 'Event contract for svc-pay-initiation-settlement (repository fintechbankx-lendingpayments-payment-orchestration-initiation-settlement).


    Status: Proposed. Owner: Payment Orchestration Squad, Lending and Money Movement Tribe. Event namespace: `evt.pay.payment`.
    This file in the provider repository is the source; the catalog copy (fintechbankx-governance-api-contracts-asyncapi-catalog)
    is updated by a pending catalog PR.


    Implementation: payment-infrastructure PaymentEventEnvelopeFactory writes the envelope into the transactional
    outbox (table outbox_event) in the same transaction as the payment; OutboxRelay publishes every event to the one
    aggregate topic `evt.pay.payment.v1` (ADR-019, one topic per aggregate) with key = aggregateId and headers eventType, eventId, correlationId, x-fapi-interaction-id (when present) and traceparent (when the
    request had one). Delivery is at least once; consumers de-duplicate on eventId and order by aggregateVersion.
    Per ADR-021 decision 4 only a payload error (record too large, serialization, invalid topic) parks a row; any
    other send failure stops the relay without skipping anything. A parked row holds back the later events of the
    same payment until an operator replays it, so a later event of a payment never arrives before a parked one
    (consumers such as the loan saga see LoanPaymentCreated before LoanPaymentCompleted); events of other payments
    continue.


    The service consumes no topics, so it owns no dead-letter topic (DLQs are consumer-owned: a consumer of this
    topic writes give-ups to its own namespace''s DLQ). The topic is created by the platform (spring.kafka.admin.auto-create=false);
    it uses cleanup.policy=delete.


    Every message uses the standard envelope (common/event-envelope.yaml, a copy of the catalog file at 44837cc). Money
    is a decimal string plus an ISO 4217 code. Adding an optional field or a new event type is a minor change; a
    removal, rename or type change in one event is a new event major (eventType ...v2) published on the same topic
    alongside the old one until consumers move.'
  tags:
  - name: payments
  - name: evt.pay.payment
  x-service-id: svc-pay-initiation-settlement
  x-event-namespace: evt.pay.payment
  x-owning-squad: Payment Orchestration Squad
defaultContentType: application/json
servers:
  msk:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Amazon MSK cluster of the FinTechBankX event platform (svc-evt-streaming) on AWS. TLS in transit,
      SASL_SSL with mechanism AWS_MSK_IAM using the service's IRSA role (ADR-024, platform contract 2026-10-08).
    variables:
      bootstrapServers:
        description: MSK IAM bootstrap brokers (port 9098), injected per environment by the platform.
    security:
    - $ref: '#/components/securitySchemes/mskIam'
  local:
    host: '{bootstrapServers}'
    protocol: kafka-secure
    description: Strimzi cluster in namespace kafka, for local and non-AWS environments only. Mutual TLS with
      Strimzi-issued client certificates.
    variables:
      bootstrapServers:
        description: Strimzi TLS bootstrap service, injected per environment.
    security:
    - $ref: '#/components/securitySchemes/mtls'
channels:
  payment:
    address: evt.pay.payment.v1
    title: evt.pay.payment.v1
    description: 'Every event of the payment aggregate, keyed by aggregateId so that the events of one aggregate instance
      stay in order in one partition (ADR-019, one topic per aggregate). The eventType record header names the event:
      Payments.Payment.Created.v1, Payments.Payment.ProcessingStarted.v1, Payments.Payment.Completed.v1,
      Payments.Payment.Failed.v1, Payments.Payment.Cancelled.v1, Payments.Payment.Refunded.v1,
      Payments.Payment.LoanPaymentCreated.v1, Payments.Payment.LoanPaymentCompleted.v1,
      Payments.Payment.LoanPaymentFailed.v1. Consumers skip event types they do not handle.'
    messages:
      PaymentCreated:
        $ref: '#/components/messages/PaymentCreated'
      PaymentProcessingStarted:
        $ref: '#/components/messages/PaymentProcessingStarted'
      PaymentCompleted:
        $ref: '#/components/messages/PaymentCompleted'
      PaymentFailed:
        $ref: '#/components/messages/PaymentFailed'
      PaymentCancelled:
        $ref: '#/components/messages/PaymentCancelled'
      PaymentRefunded:
        $ref: '#/components/messages/PaymentRefunded'
      PaymentLoanPaymentCreated:
        $ref: '#/components/messages/PaymentLoanPaymentCreated'
      PaymentLoanPaymentCompleted:
        $ref: '#/components/messages/PaymentLoanPaymentCompleted'
      PaymentLoanPaymentFailed:
        $ref: '#/components/messages/PaymentLoanPaymentFailed'
    bindings:
      kafka:
        topic: evt.pay.payment.v1
        partitions: 3
        replicas: 3
        topicConfiguration:
          cleanup.policy:
          - delete
          retention.ms: 604800000
          max.message.bytes: 1048576
        bindingVersion: 0.5.0
operations:
  publishPaymentCreated:
    action: send
    title: Publish Payments.Payment.Created.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.Created.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentCreated'
  publishPaymentProcessingStarted:
    action: send
    title: Publish Payments.Payment.ProcessingStarted.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.ProcessingStarted.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentProcessingStarted'
  publishPaymentCompleted:
    action: send
    title: Publish Payments.Payment.Completed.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.Completed.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentCompleted'
  publishPaymentFailed:
    action: send
    title: Publish Payments.Payment.Failed.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.Failed.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentFailed'
  publishPaymentCancelled:
    action: send
    title: Publish Payments.Payment.Cancelled.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.Cancelled.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentCancelled'
  publishPaymentRefunded:
    action: send
    title: Publish Payments.Payment.Refunded.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.Refunded.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentRefunded'
  publishPaymentLoanPaymentCreated:
    action: send
    title: Publish Payments.Payment.LoanPaymentCreated.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.LoanPaymentCreated.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentLoanPaymentCreated'
  publishPaymentLoanPaymentCompleted:
    action: send
    title: Publish Payments.Payment.LoanPaymentCompleted.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.LoanPaymentCompleted.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentLoanPaymentCompleted'
  publishPaymentLoanPaymentFailed:
    action: send
    title: Publish Payments.Payment.LoanPaymentFailed.v1
    summary: svc-pay-initiation-settlement publishes Payments.Payment.LoanPaymentFailed.v1 through its transactional outbox.
    channel:
      $ref: '#/channels/payment'
    messages:
    - $ref: '#/channels/payment/messages/PaymentLoanPaymentFailed'
components:
  schemas:
    EventEnvelope:
      $ref: ./common/event-envelope.yaml#/EventEnvelope
    EventHeaders:
      $ref: ./common/event-envelope.yaml#/EventHeaders
    MonetaryAmount:
      $ref: ./common/event-envelope.yaml#/MonetaryAmount
    PaymentCreatedData:
      type: object
      description: Payload of Payments.Payment.Created.v1.
      properties:
        paymentId:
          type: string
          description: Payment id (same as aggregateId).
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        amount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Payment amount.
        paymentType:
          type: string
          description: Payment type.
          enum:
          - TRANSFER
          - WIRE_TRANSFER
          - ACH
          - CHECK
          - CREDIT_CARD
          - DEBIT_CARD
          - MOBILE_PAYMENT
          - LOAN_PAYMENT
          - BILL_PAYMENT
      required:
      - paymentId
      - customerId
      - amount
      - paymentType
    PaymentProcessingStartedData:
      type: object
      description: Payload of Payments.Payment.ProcessingStarted.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
      required:
      - paymentId
      - customerId
    PaymentCompletedData:
      type: object
      description: Payload of Payments.Payment.Completed.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        amount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Completed amount.
      required:
      - paymentId
      - customerId
      - amount
    PaymentFailedData:
      type: object
      description: Payload of Payments.Payment.Failed.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        failureReason:
          type:
          - string
          - 'null'
          description: Failure reason code or text as given by the caller; null when none was given. Must not contain
            personal data.
      required:
      - paymentId
      - customerId
      - failureReason
    PaymentCancelledData:
      type: object
      description: Payload of Payments.Payment.Cancelled.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        cancellationReason:
          type:
          - string
          - 'null'
          description: Cancellation reason as given by the caller; null when none was given. Must not contain personal
            data.
      required:
      - paymentId
      - customerId
      - cancellationReason
    PaymentRefundedData:
      type: object
      description: Payload of Payments.Payment.Refunded.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        refundAmount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Refunded amount.
      required:
      - paymentId
      - customerId
      - refundAmount
    PaymentLoanPaymentCreatedData:
      type: object
      description: Payload of Payments.Payment.LoanPaymentCreated.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        loanId:
          type: string
          description: Loan id.
          minLength: 1
        scheduledAmount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Repayment amount requested by the customer.
      required:
      - paymentId
      - customerId
      - loanId
      - scheduledAmount
    PaymentLoanPaymentCompletedData:
      type: object
      description: Payload of Payments.Payment.LoanPaymentCompleted.v1. Consumed by svc-ln-loan-lifecycle, which
        applies the repayment to the loan (repayment allocation is lending data).
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        loanId:
          type: string
          description: Loan id.
          minLength: 1
        actualAmount:
          allOf:
          - $ref: '#/components/schemas/MonetaryAmount'
          description: Amount actually settled, in the payment's currency.
        completedAt:
          type: string
          format: date-time
          description: UTC instant at which the repayment settled.
        transactionReference:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Settlement reference from the caller that completed the repayment; null when none was given.
      required:
      - paymentId
      - customerId
      - loanId
      - actualAmount
      - completedAt
      - transactionReference
    PaymentLoanPaymentFailedData:
      type: object
      description: Payload of Payments.Payment.LoanPaymentFailed.v1.
      properties:
        paymentId:
          type: string
          description: Payment id.
          minLength: 1
        customerId:
          type: string
          description: Customer id.
          minLength: 1
        loanId:
          type: string
          description: Loan id.
          minLength: 1
        failureReason:
          type:
          - string
          - 'null'
          description: Failure reason code or text as given by the caller; null when none was given. Must not contain
            personal data.
      required:
      - paymentId
      - customerId
      - loanId
      - failureReason
  messages:
    PaymentCreated:
      name: PaymentCreated
      title: Payments.Payment.Created.v1
      summary: A payment was created.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Created.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Created.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentCreatedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentCreatedEvent
    PaymentProcessingStarted:
      name: PaymentProcessingStarted
      title: Payments.Payment.ProcessingStarted.v1
      summary: The payment moved from PENDING to PROCESSING.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.ProcessingStarted.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.ProcessingStarted.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentProcessingStartedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentProcessingEvent
    PaymentCompleted:
      name: PaymentCompleted
      title: Payments.Payment.Completed.v1
      summary: The payment completed.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Completed.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Completed.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentCompletedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentCompletedEvent
    PaymentFailed:
      name: PaymentFailed
      title: Payments.Payment.Failed.v1
      summary: The payment failed.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Failed.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Failed.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentFailedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentFailedEvent
    PaymentCancelled:
      name: PaymentCancelled
      title: Payments.Payment.Cancelled.v1
      summary: The payment was cancelled.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Cancelled.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Cancelled.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentCancelledData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentCancelledEvent
    PaymentRefunded:
      name: PaymentRefunded
      title: Payments.Payment.Refunded.v1
      summary: The payment was refunded.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Refunded.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.Refunded.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentRefundedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.PaymentRefundedEvent
    PaymentLoanPaymentCreated:
      name: PaymentLoanPaymentCreated
      title: Payments.Payment.LoanPaymentCreated.v1
      summary: A loan repayment payment was created.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentCreated.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentCreated.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentLoanPaymentCreatedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.LoanPaymentCreatedEvent
    PaymentLoanPaymentCompleted:
      name: PaymentLoanPaymentCompleted
      title: Payments.Payment.LoanPaymentCompleted.v1
      summary: A loan repayment payment completed.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentCompleted.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentCompleted.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentLoanPaymentCompletedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.LoanPaymentCompletedEvent
    PaymentLoanPaymentFailed:
      name: PaymentLoanPaymentFailed
      title: Payments.Payment.LoanPaymentFailed.v1
      summary: A loan repayment payment failed.
      contentType: application/json
      headers:
        allOf:
        - $ref: '#/components/schemas/EventHeaders'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentFailed.v1
      payload:
        allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            eventType:
              const: Payments.Payment.LoanPaymentFailed.v1
            producer:
              const: svc-pay-initiation-settlement
            data:
              $ref: '#/components/schemas/PaymentLoanPaymentFailedData'
      bindings:
        kafka:
          key:
            type: string
            description: aggregateId (paymentId).
          bindingVersion: 0.5.0
      x-source-class: com.bank.payment.domain.LoanPaymentFailedEvent
  securitySchemes:
    mskIam:
      type: userPassword
      description: SASL_SSL with SASL mechanism AWS_MSK_IAM. There is no user or password; the client signs with the
        AWS credentials of its IRSA role, and a topic-scoped IAM policy (terraform module msk-client-access) grants
        produce or consume rights. AsyncAPI has no IAM scheme type, so userPassword stands for the SASL family.
      x-sasl-mechanism: AWS_MSK_IAM
    mtls:
      type: X509
      description: Mutual TLS with Strimzi-issued client certificates (local and non-AWS clusters only).
